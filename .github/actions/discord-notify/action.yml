name: 'Discord Notification'
description: 'Send build status notification to Discord'

inputs:
  webhook_url:
    description: 'Discord webhook URL'
    required: true
  image_name:
    description: 'Image name (e.g., radarr)'
    required: true
  tag:
    description: 'Image tag (e.g., latest)'
    required: true
  status:
    description: 'Job status (success, failure, cancelled)'
    required: true
  commit_sha:
    description: 'Git commit SHA'
    required: true
  commit_url:
    description: 'URL to the commit'
    required: true
  run_url:
    description: 'URL to the workflow run'
    required: true
  branch:
    description: 'Git branch name'
    required: true
  has_dockerhub:
    description: 'Whether Docker Hub credentials are available'
    required: false
    default: 'false'
  version:
    description: 'Version string (e.g. "1.2.3" or "1.2.2 → 1.2.3")'
    required: false
    default: ''
  pushed:
    description: 'Whether the image was actually pushed (false for PR/test-only builds)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Send notification
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook_url }}
        IMAGE_NAME: ${{ inputs.image_name }}
        TAG: ${{ inputs.tag }}
        STATUS: ${{ inputs.status }}
        COMMIT_SHA: ${{ inputs.commit_sha }}
        COMMIT_URL: ${{ inputs.commit_url }}
        RUN_URL: ${{ inputs.run_url }}
        BRANCH: ${{ inputs.branch }}
        HAS_DOCKERHUB: ${{ inputs.has_dockerhub }}
        VERSION: ${{ inputs.version }}
        PUSHED: ${{ inputs.pushed }}
      run: |
        if [ -z "$WEBHOOK_URL" ]; then
          exit 0
        fi

        if [ "$STATUS" = "success" ]; then
          COLOR=3066993
          STATUS_EMOJI="✅ Success"
        elif [ "$STATUS" = "cancelled" ]; then
          COLOR=15105570
          STATUS_EMOJI="⚠️ Cancelled"
        else
          COLOR=15158332
          STATUS_EMOJI="❌ Failed"
        fi

        SHORT_SHA="${COMMIT_SHA:0:7}"

        if [ "$PUSHED" = "false" ]; then
          REGISTRY_VALUE="🧪 test only — not pushed"
        else
          REGISTRY_VALUE="[ghcr.io](https://ghcr.io/daemonless/${IMAGE_NAME})"
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            REGISTRY_VALUE="[ghcr.io](https://ghcr.io/daemonless/${IMAGE_NAME}) / [docker.io](https://hub.docker.com/r/daemonless/${IMAGE_NAME})"
          fi
        fi

        TITLE="${IMAGE_NAME}:${TAG}"
        if [ -n "$VERSION" ]; then
          TITLE="$TITLE ($VERSION)"
        fi

        PAYLOAD=$(jq -n \
          --arg title "$TITLE $STATUS_EMOJI" \
          --arg url "$RUN_URL" \
          --argjson color "$COLOR" \
          --arg commit "[$SHORT_SHA]($COMMIT_URL)" \
          --arg branch "$BRANCH" \
          --arg registry "$REGISTRY_VALUE" \
          '{embeds:[{title:$title,url:$url,color:$color,fields:[{name:"Commit",value:$commit,inline:true},{name:"Branch",value:$branch,inline:true},{name:"Registry",value:$registry,inline:true}]}]}')

        curl -sS -H "Content-Type: application/json" \
          --data-binary "$PAYLOAD" \
          "$WEBHOOK_URL"
